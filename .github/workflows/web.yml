# Publishes the web version to GitHub Pages on every push to main:
#   https://leonfighter1.github.io/JoyPainting/
# On iPhone or iPad: open it in Safari, then Share → Add to Home Screen.
#
# One-time setup in the repository: Settings → Pages → Build and deployment
# → Source: GitHub Actions.
#
# For a custom domain later: build with `--base-href /` instead, and set the
# domain under Settings → Pages.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      # Saving paintings in the browser (IndexedDB), and the SVG export with
      # the web engine measuring paths and text, only run in a browser.
      - name: Browser tests (Chrome)
        run: flutter test --platform chrome test/web_store_test.dart test/svg_web_test.dart

      # The rendering engine (CanvasKit) is served from this site too, not
      # from Google's CDN, so the app loads wherever GitHub Pages does.
      - name: Build
        run: flutter build web --release --base-href /JoyPainting/ --no-web-resources-cdn

      # GitHub Pages lets browsers keep files for 10 minutes. A release
      # number on the code's address means a browser that gets the new page
      # also gets the new code, never a cached older copy of it.
      - name: Tag the code with this release
        run: |
          v="${{ github.run_number }}"
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=$v\"|" build/web/flutter_bootstrap.js
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=$v\"|" build/web/index.html
          grep -q "main.dart.js?v=$v" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$v" build/web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
